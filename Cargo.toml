[package]
name = "zeta"
version = "0.5.3"
edition = "2021"

[features]
default = []
# Enables extraction/preview of `.tar.bz2` and `.tar.xz` archives.
# Off by default because bzip2-sys and lzma-sys are C builds that noticeably
# slow `cargo install zeta`. Without this feature those formats produce a
# clear runtime error; `.zip`, `.tar`, `.tar.gz` continue to work.
archives-extra = ["dep:bzip2", "dep:xz2"]

[dependencies]
anyhow = "1.0"
# Clipboard: only text APIs are used (see src/state/editor_state.rs, src/state/mod.rs).
# Disabling default features drops the `image-data` feature, which would otherwise
# pull a full `image` build (exr/ravif/tiff/...) just for clipboard image transfer.
arboard = { version = "3", default-features = false }
crossbeam-channel = "0.5"
crossterm = "0.28"
dirs = "5"
notify = "6"
open = "5"
ratatui = "0.30"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = { version = "3", default-features = false, features = ["coinit_apartmentthreaded"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "default-syntaxes"] }
thiserror = "2.0"
ssh2 = "0.9"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
tui-input = "0.14"
unicode-width = "0.2"
# basic-toml is a slim TOML parser/serializer (no `toml_edit`/`winnow`).
# We don't need format-preserving edits — just (de)serialize via serde.
basic-toml = "0.1"
# zip browsing/extraction only needs the deflate codec for typical archives.
# Default features add zstd (heavy C build), aes, bzip2, time — none of which we use.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
# bzip2 + xz2 pull C builds (bzip2-sys, lzma-sys). Gate behind `archives-extra`
# (off by default) so the common `cargo install zeta` path stays lean.
bzip2 = { version = "0.4", optional = true }
xz2 = { version = "0.1", optional = true }
# Trim chrono: drop default `oldtime`, `wasmbind`, etc. We only need clock + std for
# formatting/now(); this also avoids pulling iana-time-zone where unnecessary.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
tempfile = "3"
vt100 = "0.15"
# Disable `image-defaults` (re-enables every image codec) and `chafa-dyn`
# (runs pkg-config at build looking for libchafa). We provide our own
# image features above; halfblocks/sixel/kitty work without them.
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
ureq = { version = "2.9", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
conpty = "0.7"

# portable-pty is only used by the Unix branch of src/pty.rs; on Windows we use
# conpty directly. Scoping it to cfg(unix) avoids compiling portable-pty + nix +
# serial2 + filedescriptor on Windows builds.
[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"

[profile.release]
opt-level = "z"     # optimise for binary size
lto = true          # link-time optimisation removes dead code across crates
codegen-units = 1   # single codegen unit improves LTO and size
strip = true        # strip debug symbols from the binary
panic = "abort"     # smaller panic handler, no unwinding machinery
overflow-checks = false  # elide overflow checks; saves code size and a branch per arithmetic op
